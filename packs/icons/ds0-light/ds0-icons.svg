  <!--
    DS0 icon pack v0.1, stroke 1.1 - 2026-11-22
    Own geometry. 24x24 grid, 1.5 stroke, square caps and joins, no fills.
    Language: straight cuts, a single 3px corner nick where a shape closes,
    an arch and a meander where a Roman shape helps. Icons inherit currentColor.
    Role names are the contract (docs/design/DS0-ICON-ROLES.md): a pack can be
    swapped wholesale as long as every symbol id i-<role> exists.
  -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: square; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
      symbol .f { fill: currentColor; stroke: none; }
      symbol .d { stroke-dasharray: 1.5 2.5; }
      symbol .a { stroke: var(--accent, currentColor); }
    </style>
  </defs>

